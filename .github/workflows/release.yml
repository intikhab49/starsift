name: release

# Publishing a GitHub release runs the tests, builds the package and uploads it to PyPI
# through trusted publishing, so no PyPI token is stored anywhere.
# To release: bump __version__ in src/starsift/__init__.py, push, then publish a GitHub
# release tagged v<that version>. A tag that doesn't match the version stops the run.

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import ast; t = ast.parse(open('src/starsift/__init__.py').read()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'))")
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG doesn't match __version__ $version"
            exit 1
          fi
      - run: python -m pip install -e ".[test]" build
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/starsift/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
